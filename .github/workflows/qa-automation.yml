name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  backend-check:
    name: Backend - Install & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Check backend starts (syntax check)
        run: |
          cd backend
          node --check src/server.js
        env:
          NODE_ENV: test

  frontend-build:
    name: Frontend - Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE_URL: https://api.kohinoorgemstone.com/api
          VITE_SOCKET_URL: https://api.kohinoorgemstone.com

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]
    if: always()

    steps:
      - name: Report status
        run: |
          echo "## CI Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Install & Syntax Check | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ✅ |" >> $GITHUB_STEP_SUMMARY
